    <style>
        .container {
            padding: 30px;
            margin: 0 auto;
        }

        .form-control {
            display: block;
            position: relative;
            padding-left: 36px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 24px;
        }

        .custom-radio {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            background-color: #ddd;
            border-radius: 50%;
        }

        .form-control:hover input~.custom-radio {
            background-color: #ccc;
        }

        .form-control input:checked~.custom-radio {
            background-color: aqua;
        }

        .form-control input:checked~.custom-radio::after {
            display: block;
        }

        .custom-radio::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #fff;
            display: none;
        }

        .form-control input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .custom-checkbox {
            position: absolute;
            top: 0;
            left: 0;
            height: 24px;
            width: 24px;
            background-color: #ddd;
        }

        .custom-checkbox::after {
            position: absolute;
            top: 4px;
            left: 8px;
            width: 5px;
            height: 10px;
            content: '';
            border: solid #fff;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
            display: none;
        }

        .form-control input:checked~.custom-checkbox {
            background-color: green;
        }

        .form-control input:checked~.custom-checkbox::after {
            display: block;
        }
    </style>
</head>

<body>
